model:
  class_path: multimodal.lightning_modules.RouterLightningModule 
  init_args:
    network:
      class_path: multimodal.models.transformer_feature_router_updated.EncodersTransformerFeatureRouterDecoder
      init_args:
        spatial_dims: 3
        num_encoders: 4
        input_shape: 160
        encoder_in_channels: 1
        encoder_filters: [16,32,64,128,256,320]
        encoder_res_block: true
        decoder_out_channels: ${eval:${length:${data.init_args.labels}}+1}
        decoder_num_output_heads: 4
        decoder_upsample_outputs: true
        router_patch_sizes: [5,5,5,5,5,5]
        router_embedding_dim: [16,32,64,128,256,320]
        router_mlp_dim: [64,128,256,512,1024,1280]
        router_window_size: [4, 4, 4, 4, 2, 1]
        router_num_heads: 8
        router_num_blocks: [8,8,8,8,8,8]
        router_reduction: none
    loss_fn:
      class_path: multimodal.losses.MyDeepSupervisionLoss
      init_args:
        loss: 
          class_path: multimodal.losses.MyDiceCELoss
          init_args:
            include_background: false
            softmax: true
            reduction: mean_per_batch
        weight_mode: exp
        norm: true 
        max_pool: false
    patch_size: [160,160,160]
    modality_augmentation_fn:
      class_path: multimodal.dropout.RandomUniformMultiDropCorrupt
      init_args:
        num_modalities: 4
        num_skip_epochs_dropout: 0
        num_skip_epochs_corruption: 10000
        corruption_prob: 0.5
    inference_corruption_fn:
      class_path: multimodal.corruption.TestTimeCorruption
      init_args:
        transform:
          class_path: monai.transforms.RandGaussianNoise
          init_args:
            prob: 1.0
            mean: 0.0
            std: 5.0
    modality_loss_weight: [0.25,0.25,0.25,0.25]
    num_epochs_skip_weight: 10000
    num_epochs_all_modalities: 0
    inference_modalities:
      - ["T1w"]
      - ["T1w", "T2w"]
      - ["T1w", "FLAIR"]
      - ["T1w", "DWI"]
      - ["T1w", "T2w", "FLAIR"]
      - ["T1w", "T2w", "DWI"]
      - ["T1w", "FLAIR", "DWI"]
      - ["T1w", "T2w", "FLAIR", "DWI"]
      - ["T2w"]
      - ["T2w", "FLAIR"]
      - ["T2w", "DWI"]
      - ["T2w", "FLAIR", "DWI"]
      - ["FLAIR"]
      - ["FLAIR", "DWI"]
      - ["DWI"]
    inference_corruption:
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
    pred_dir: null
    metric_dir: results/experiment_1_mss3/metrics/router_m
data:
  class_path: multimodal.data_modules.DataModule 
  init_args:
    data_dir: data
    train_csv: data/splits_experiment_1/train.csv
    val_csv: data/splits_experiment_1/val.csv
    test_csv: data/splits_experiment_1/test.csv
    predict_csv: data/splits_experiment_1/test.csv
    modalities: ["T1w", "T2w", "FLAIR", "DWI"]
    labels: ["WMH", "ISLtotal"]
    train_transforms:
      class_path: torchio.transforms.Compose
      init_args:
        transforms:
          - class_path: multimodal.transforms.CopyAnyAffine
          - class_path: torchio.transforms.RescaleIntensity
          - class_path: torchio.transforms.RandomAffine
            init_args:
              p: 0.2
              scales: [0.7, 1.4]
              degrees: 90
              isotropic: true
          - class_path: torchio.transforms.RandomNoise
            init_args:
              p: 0.15
              mean: 0
              std: [0, 0.316]
          - class_path: torchio.transforms.RandomBlur
            init_args:
              p: 0.1
              std: [0.5, 1.5]
          - class_path: multimodal.transforms.Contrast
            init_args:
              p: 0.15
              rng: [0.65, 1.5]
          - class_path: multimodal.transforms.SimulateLowResolution
            init_args:
              p: 0.25
              factor: [1, 2]
          - class_path: multimodal.transforms.Gamma
            init_args:
              p: 0.15
              rng: [0.7, 1.5]
          - class_path: torchio.transforms.RandomFlip
            init_args:
              p: 0.5
              axes: [0, 1, 2]
          - class_path: torchio.transforms.RandomMotion
            init_args:
              p: 0.05
          - class_path: torchio.transforms.RandomGhosting 
            init_args:
              p: 0.05
          - class_path: torchio.transforms.RandomSpike 
            init_args:
              p: 0.05
          - class_path: torchio.transforms.RandomBiasField 
            init_args:
              p: 0.05
          - class_path: torchio.transforms.RescaleIntensity
            init_args:
              percentiles: [0.5, 99.5]
          - class_path: multimodal.transforms.AddMissingModalities
            init_args:
              all_modalities: ["T1w", "T2w", "FLAIR", "DWI"]
    val_transforms:
      class_path: torchio.transforms.Compose
      init_args:
        transforms:
          - class_path: multimodal.transforms.CopyAnyAffine
          - class_path: torchio.transforms.RescaleIntensity
            init_args:
              percentiles: [0.5, 99.5]
          - class_path: torchio.transforms.CropOrPad
            init_args:
              target_shape: ${model.init_args.patch_size}
          - class_path: multimodal.transforms.AddMissingModalities
            init_args:
              all_modalities: ["T1w", "T2w", "FLAIR", "DWI"]
    inference_transforms:
      class_path: torchio.transforms.Compose
      init_args:
        transforms:
          - class_path: multimodal.transforms.CopyAnyAffine
          - class_path: multimodal.transforms.ResampleWithinRange
            init_args:
              target: [0.95, 1.05, 0.95, 1.05, 0.95, 1.05]
              to_midpoint: true
              resample_kwargs:
                scalars_only: true
          - class_path: torchio.transforms.RescaleIntensity
            init_args:
              percentiles: [0.5, 99.5]
          - class_path: multimodal.transforms.AddMissingModalities
            init_args:
              all_modalities: ["T1w", "T2w", "FLAIR", "DWI"]
    sampler:
      class_path: torchio.data.UniformSampler
      init_args:
        patch_size: ${model.init_args.patch_size}
    queue_max_length: 150
    samples_per_volume: 2
    num_workers: 8
    batch_size: 1
    load_in_memory: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0003
    weight_decay: 0.01
lr_scheduler:
  class_path: multimodal.schedulers.WarmupCosineLR
  init_args:
    warmup_epochs: 10
    max_epochs: ${trainer.max_epochs}
    start_factor: 0.1
    eta_min: 0.0
trainer:
  accumulate_grad_batches: 2
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: MultiModal_mss3
      log_model: false
      save_dir: logs/experiment_1_mss3/router_m
      name: router_m
  accelerator: gpu
  precision: bf16-mixed
  max_epochs: 1000
  check_val_every_n_epoch: 25
  log_every_n_steps: 1 # not used since we log per epoch anyway
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: multimodal.callbacks.TimeIteration
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-T1w={T1w/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: T1w/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-T2w={T2w/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: T2w/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-FLAIR={FLAIR/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: FLAIR/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-DWI={DWI/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: DWI/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-T1w_T2w={T1w_T2w/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: T1w_T2w/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-dice-T1w_FLAIR={T1w_FLAIR/macro_avg:.3f}
        auto_insert_metric_name: false
        monitor: T1w_FLAIR/macro_avg
        mode: max
        every_n_epochs: ${trainer.check_val_every_n_epoch}
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
